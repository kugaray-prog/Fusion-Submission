# GeoAttend dev stack. First run:
#   docker compose up -d --build
#   docker compose exec app npm run seed

services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-geoattend_root}
      MYSQL_DATABASE: geoattend_pro
      TZ: Asia/Manila
    command: --default-time-zone=+08:00
    volumes:
      - db_data:/var/lib/mysql
      # Runs only when db_data is empty (first start), creating every table.
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    ports:
      - "3307:3306" # host 3307 so it doesn't clash with a local MySQL on 3306
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD:-geoattend_root}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:-geoattend_root}
      DB_NAME: geoattend_pro
      PORT: 2620
      TZ: Asia/Manila
    ports:
      - "2620:2620"
    # -L: poll for changes (Windows file events don't reach the container).
    command: ["nodemon", "-L", "server.js"]
    volumes:
      - .:/app
      # Keep the image's Linux node_modules instead of the Windows copy.
      - /app/node_modules
      - uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy

  # Expo dev server for Expo Go. QR code: docker compose logs -f expo
  expo:
    build: ./mobile
    restart: unless-stopped
    environment:
      REACT_NATIVE_PACKAGER_HOSTNAME: ${HOST_LAN_IP:?Set HOST_LAN_IP in .env to this PC's Wi-Fi IPv4 (ipconfig)}
      # Google Sign-In needs an https:// origin (Google rejects http://<LAN IP>
      # with redirect_uri_mismatch), so prefer the HTTPS tunnel when set.
      API_BASE_URL: ${MOBILE_API_BASE_URL:-http://${HOST_LAN_IP}:2620/api}
      EXPO_NO_TELEMETRY: "1"
      # Optional: skips Expo's login prompt.
      EXPO_TOKEN: ${EXPO_TOKEN:-}
    ports:
      - "8081:8081"
    volumes:
      # Live-edit mobile/ from Windows; keep the Linux node_modules from the
      # image instead of the Windows one in mobile/node_modules.
      - ./mobile:/app
      - expo_node_modules:/app/node_modules
      # Keeps the `npx expo login` session across container rebuilds; Expo Go
      # refuses to open the project if the phone is signed in and the CLI isn't.
      - expo_home:/root/.expo
    tty: true
    stdin_open: true
    depends_on:
      - app

  # HTTPS tunnel for MOBILE_API_BASE_URL. One-time: docker compose run --rm tunnel login
  tunnel:
    build: ./docker/devtunnel
    restart: unless-stopped
    network_mode: "service:app"
    environment:
      DEVTUNNEL_ID: ${DEVTUNNEL_ID:-pq2qwb2x.asse}
    volumes:
      - devtunnel_home:/root
    depends_on:
      - app

  # Release APK builder -> public/downloads/. Run: docker compose run --rm apk
  apk:
    build:
      context: ./mobile
      dockerfile: Dockerfile.apk
    profiles: ["apk"]
    environment:
      API_BASE_URL: ${MOBILE_API_BASE_URL:-http://${HOST_LAN_IP}:2620/api}
      APK_NAME: ${APK_NAME:-GeoAttend.apk}
      APK_ARCHS: ${APK_ARCHS:-arm64-v8a}
      EXPO_NO_TELEMETRY: "1"
    volumes:
      - ./mobile:/src:ro
      - apk_work:/work
      - apk_gradle:/root/.gradle
      - ./public/downloads:/out

volumes:
  apk_work:
  apk_gradle:
  devtunnel_home:
  db_data:
  uploads:
  expo_node_modules:
  expo_home:
